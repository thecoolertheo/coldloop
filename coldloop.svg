<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0b111a"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25"
        fill="none" stroke="#263345" stroke-width="1.5"/>

  <!-- coolant gauge: 270 degree sweep with a bottom gap, as on the LCD -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#1d2838"
          stroke-width="9" stroke-linecap="round"
          stroke-dasharray="179 60" transform="rotate(135 64 64)"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#ring)"
          stroke-width="9" stroke-linecap="round"
          stroke-dasharray="125 114" transform="rotate(135 64 64)"/>

  <!-- droplet -->
  <path d="M64 40c9 11 14 18 14 24a14 14 0 0 1-28 0c0-6 5-13 14-24z" fill="#2dd4bf"/>
  <path d="M58 66a6 6 0 0 0 4 6" fill="none" stroke="#0b111a"
        stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
